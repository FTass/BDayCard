<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BS Card Page Flip</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>

  <style>
    :root{
      --w: 360px;      /* ancho del card/hoja */
      --h: 240px;      /* alto del card/hoja */
    }

    /* Contenedor con perspectiva (la “cámara” 3D) */
    .flip-stage{
      perspective: 1600px;
      display: grid;
      gap: 16px;
      place-items: center;
      min-height: 100dvh;
      background: radial-gradient(circle at 30% 20%, #f7f9ff, #e9eef8);
    }

    /* La “hoja” que gira (tu card) */
    .sheet{
      position: relative;
      width: min(90vw, var(--w));
      height: var(--h);
      transform-style: preserve-3d;
      transform-origin: left center;         /* ¡gira desde el lomo izquierdo! */
      transition: transform .9s cubic-bezier(.22,.61,.36,1);
      cursor: pointer;
    }

    /* Sombras que dan sensación de papel */
    .sheet::before{
      content: "";
      position: absolute; inset: 0;
      pointer-events: none;
      background: linear-gradient(90deg,
        rgba(0,0,0,.15), transparent 30%, transparent 70%, rgba(0,0,0,.12));
      opacity: .0;
      transition: opacity .4s ease;
    }
    .sheet:hover::before{ opacity: .5; }
    .sheet.flipped::before{ opacity: .2; }

    /* Cada cara ocupa toda la hoja */
    .face{
      position: absolute; inset: 0;
      backface-visibility: hidden;          /* no ver el dorso al revés */
      display: grid;
    }

    /* Frente: un card Bootstrap normal */
    .front > .card,
    .back  > .card{
      width: 100%;
      height: 100%;
    }

    /* Reverso: lo pre-rotamos 180°, así al girar se lee derecho */
    .back{
      transform: rotateY(180deg);
    }

    /* Estado girado (pasa página) */
    .sheet.flipped{
      transform: rotateY(-180deg);
    }

    /* (Opcional) pequeño “pliegue” en el lomo */
    .spine-deco{
      position: absolute;
      top: 0; bottom: 0; left: -1px; width: 2px;
      background: linear-gradient(#0004, #0000 40% 60%, #0004);
      filter: blur(.5px);
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="flip-stage container">
    <!-- Hoja/Card -->
    <div class="sheet" id="page">
      <span class="spine-deco" aria-hidden="true"></span>

      <!-- Cara frontal (lo que ves primero) -->
      <div class="face front">
        <div class="card shadow">
          <div class="card-body d-flex flex-column justify-content-center">
            <h5 class="card-title mb-2">Portada del Card</h5>
            <p class="card-text mb-4">
              Este es el frente. Haz clic aquí o en el botón para “pasar página”.
            </p>
            <div>
              <span class="badge text-bg-primary">Bootstrap</span>
              <span class="badge text-bg-secondary">Page Flip</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Cara trasera (aparece tras el giro) -->
      <div class="face back">
        <div class="card shadow">
          <div class="card-body d-flex flex-column justify-content-center">
            <h5 class="card-title mb-2">Reverso del Card</h5>
            <p class="card-text mb-4">
              ¡Giraste la hoja! Aquí podrías poner más info, botones, etc.
            </p>
            <a href="#" class="btn btn-outline-primary btn-sm" id="go-back">Volver a la portada</a>
          </div>
        </div>
      </div>
    </div>

    <!-- Controles -->
    <div class="d-flex gap-2">
      <button class="btn btn-dark" id="btn-flip">Pasar página</button>
      <button class="btn btn-outline-dark" id="btn-unflip" disabled>Volver</button>
    </div>
  </div>

  <script>
    // 2) Lógica mínima: alternar la clase .flipped
    const sheet     = document.getElementById('page');
    const btnFlip   = document.getElementById('btn-flip');
    const btnUnflip = document.getElementById('btn-unflip');
    const goBack    = document.getElementById('go-back');

    function updateButtons(){
      const flipped = sheet.classList.contains('flipped');
      btnFlip.disabled   = flipped;
      btnUnflip.disabled = !flipped;
    }

    btnFlip.addEventListener('click', () => {
      sheet.classList.add('flipped');
      updateButtons();
    });

    btnUnflip.addEventListener('click', () => {
      sheet.classList.remove('flipped');
      updateButtons();
    });

    // Clic en la hoja también voltea (si está en frente)
    sheet.addEventListener('click', () => {
      if (!sheet.classList.contains('flipped')){
        sheet.classList.add('flipped');
        updateButtons();
      }
    });

    // Botón dentro del reverso
    goBack.addEventListener('click', (e) => {
      e.preventDefault();
      sheet.classList.remove('flipped');
      updateButtons();
    });

    // Accesibilidad con teclado (← →)
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') { sheet.classList.add('flipped'); updateButtons(); }
      if (e.key === 'ArrowLeft')  { sheet.classList.remove('flipped'); updateButtons(); }
    });

    updateButtons();
  </script>
</body>
</html>
